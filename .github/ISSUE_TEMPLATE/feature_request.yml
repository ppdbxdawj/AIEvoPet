name: Feature request
description: Suggest a feature for AIEvoPet
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your desired behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pet interaction
        - AI memory / dialogue
        - Growth / economy
        - Onboarding
        - Reminder / calendar
        - Rendering / sprite pipeline
        - Tooling / bridge
        - Docs / DX
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
